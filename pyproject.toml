[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "wyoming-qwen3-tts"
dynamic = ["version"]
description = "Wyoming-compatible Qwen3-TTS text-to-speech server for Home Assistant, tuned for German"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # PyTorch - install with: --extra-index-url https://download.pytorch.org/whl/cu128
    # cu128 is required for RTX 50xx (Blackwell, sm_120)
    "torch>=2.7",
    "faster-qwen3-tts>=0.5.4,<0.6",
    # transformers 5.19 breaks qwen-tts-hf (MimiConfig has no rope_theta)
    "transformers==5.15.1",
    "wyoming[zeroconf]>=1.10.2",
    # 1.4.0 is not on PyPI yet; 1.3.0 misses boundaries after "Uhr."
    "sentence-stream @ git+https://github.com/OHF-Voice/sentence-stream@ba166de913bc71e43f1b31fa19da1e606cc2c744",
    "num2words==0.5.14",
    "emoji>=2.15",
    "pydantic-settings>=2.0",
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
wyoming-qwen3-tts = "wyoming_qwen3_tts.__main__:run"

[tool.setuptools]
packages = ["wyoming_qwen3_tts"]

[tool.setuptools_scm]
# version from git tags: v1.0.0 -> 1.0.0
# untagged commits: 1.0.0.dev1+g1234567

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "PL",     # pylint
    "RUF",    # ruff-specific
    "PERF",   # perflint
]
ignore = [
    "PLR0913",  # too many arguments - synthesis has many params
    "PLR2004",  # magic values - audio constants are fine
    "PLR0911",  # too many return statements - event handlers have many branches
    "PLR0915",  # too many statements - main() is fine as-is
    "PLC0415",  # import not at top level - zeroconf is optional dependency
]

[tool.ruff.lint.isort]
known-first-party = ["wyoming_qwen3_tts"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "faster_qwen3_tts.*",
    "num2words.*",
    "sentence_stream.*",
    "torch.*",
    "wyoming.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
